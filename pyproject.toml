[project]
name = "reel-text"
version = "0.1.0"
description = "Local Instagram audio transcription with Deepgram"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "requests>=2.32,<3",
    "python-dotenv>=1,<2",
    "yt-dlp>=2025.1",
]

[project.scripts]
reel-text = "reel_text.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reel_text*"]

[tool.setuptools.package-data]
reel_text = ["static/*"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
